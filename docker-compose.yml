services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: pricing_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build: ./backend
    restart: always
    ports:
      - "12765:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/pricing_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "32765:80"
    depends_on:
      - backend

volumes:
  db_data:
